  var f=document.getElementById("f"), p=document.getElementById("p"),
      b=document.getElementById("b"), e=document.getElementById("e");

  function b64(s){ var r=atob(s), a=new Uint8Array(r.length);
    for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }

  async function open_(pw){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
      "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(BLOB.salt), iterations:ITER, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.iv)}, key, b64(BLOB.data));
    // 復号できたパスワードは、別ページで再入力させないためタブ内だけに保持する
    try{ sessionStorage.setItem(KEY, pw); }catch(_){}
    var html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  }

  // WebCrypto は https（および localhost）でしか使えない。
  // ファイルをダブルクリックして file:// で開いた場合はここで止まる。
  if(!(window.crypto && crypto.subtle)){
    e.textContent="このページは https で開いてください。";
    p.disabled=true; b.disabled=true; return;
  }

  f.addEventListener("submit", function(ev){
    ev.preventDefault(); e.textContent=""; b.disabled=true; b.textContent="開いています…";
    open_(p.value).catch(function(){
      e.textContent="パスワードが違います。";
      b.disabled=false; b.textContent="開く"; p.select();
    });
  });

  // 同じタブで一度開いていれば、そのまま表示する
  var saved=null; try{ saved=sessionStorage.getItem(KEY); }catch(_){}
  if(saved) open_(saved).catch(function(){ try{sessionStorage.removeItem(KEY);}catch(_){} p.focus(); });
  else p.focus();
})();
