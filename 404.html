<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜アクアレスキュー</title>
<!-- 存在しないURLの下でも表示されるため、CSSは外部化せずここに書く -->
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#e2f6ff;color:#10293a;padding:24px;
    font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
    font-size:15.5px;line-height:1.75;font-weight:500}
  .box{background:#fff;border:2px solid #42a4f4;border-radius:12px;
    padding:30px 22px;width:min(94vw,460px);text-align:center;
    box-shadow:0 6px 24px rgba(0,32,80,.14)}
  h1{margin:0 0 6px;font-size:20px;font-weight:700;color:#0048ac;line-height:1.5}
  p{margin:0 0 20px;font-size:14.5px;color:#2c4e5f}
  .tel{display:block;text-decoration:none;border-radius:12px;padding:12px 16px;
    background:linear-gradient(to right bottom,#ef7f0a,#e83200);box-shadow:0 3px 0 #b82600}
  .tel .num{display:block;color:#fff;font-size:26px;font-weight:700;line-height:1.25;
    letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .tel .sub{display:block;color:#fff;font-size:12px;font-weight:700;margin-top:3px}
  .back{display:inline-block;margin-top:18px;font-size:14px;font-weight:700;
    color:#0048ac;text-underline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。</p>
    <a class="tel" href="tel:07016504108">
      <span class="num">070-1650-4108</span>
      <span class="sub">24時間受付／ご相談・お見積りは無料</span>
    </a>
    <a class="back" href="/">トップページへ戻る</a>
  </div>
</body>
</html>
